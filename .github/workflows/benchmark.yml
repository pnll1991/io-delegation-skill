name: Controlled token benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - benchmarks/run.py
      - benchmarks/requirements.txt
      - .github/workflows/benchmark.yml

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      TOKENIZERS_PARALLELISM: 'false'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Verify infrastructure and benchmark contracts
        run: python -m unittest discover -s tests -v
      - name: Install benchmark-only dependencies
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r benchmarks/requirements.txt
      - name: Count exact tokens and run local-model pilot
        run: python benchmarks/run.py --live --repeat 1 --output benchmark-output
      - name: Preserve all results, partial progress and exact prompts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-output/
          if-no-files-found: warn
          retention-days: 90
