name: Token census

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - benchmarks/run.py
      - skills/io-delegation/SKILL.md
      - skills/io-delegation/scripts/io_delegate.py
      - install.py
      - .github/workflows/token-census.yml
  pull_request:
    paths:
      - benchmarks/run.py
      - skills/io-delegation/SKILL.md
      - skills/io-delegation/scripts/io_delegate.py
      - install.py
      - .github/workflows/token-census.yml

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install tiktoken==0.11.0
      - run: python benchmarks/run.py --output benchmark-output
      - uses: actions/upload-artifact@v4
        with:
          name: token-census
          path: benchmark-output/
          retention-days: 90
